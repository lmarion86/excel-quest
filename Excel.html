<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel Quest: El Dominio de la Hoja de Cálculo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Source+Sans+3:wght@300;400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script>
        tailwind.config = { theme: { extend: { colors: { q: { bg: '#080d0b', card: '#0f1a15', border: '#1a2e24', text: '#e8f0ec', muted: '#5a7d6c', accent: '#00e676', gold: '#ffab00', danger: '#ff5252', dark: '#060a08', deep: '#0a120e' } }, fontFamily: { display: ['Cinzel', 'serif'], body: ['Source Sans 3', 'sans-serif'] } } } }
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        body {
            background: #080d0b;
            color: #e8f0ec;
            font-family: 'Source Sans 3', sans-serif;
            overflow-x: hidden
        }

        ::-webkit-scrollbar {
            width: 6px
        }

        ::-webkit-scrollbar-track {
            background: #080d0b
        }

        ::-webkit-scrollbar-thumb {
            background: #1a2e24;
            border-radius: 3px
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #00e676
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0) rotate(0deg)
            }

            50% {
                transform: translateY(-20px) rotate(5deg)
            }
        }

        @keyframes pulse-glow {

            0%,
            100% {
                box-shadow: 0 0 20px rgba(0, 230, 118, 0.15)
            }

            50% {
                box-shadow: 0 0 40px rgba(0, 230, 118, 0.35)
            }
        }

        @keyframes slide-up {
            from {
                opacity: 0;
                transform: translateY(30px)
            }

            to {
                opacity: 1;
                transform: translateY(0)
            }
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0)
            }

            20%,
            60% {
                transform: translateX(-8px)
            }

            40%,
            80% {
                transform: translateX(8px)
            }
        }

        @keyframes celebrate {
            0% {
                transform: scale(1)
            }

            50% {
                transform: scale(1.15)
            }

            100% {
                transform: scale(1)
            }
        }

        @keyframes glow-pulse {

            0%,
            100% {
                text-shadow: 0 0 10px rgba(0, 230, 118, 0.3)
            }

            50% {
                text-shadow: 0 0 25px rgba(0, 230, 118, 0.6), 0 0 50px rgba(0, 230, 118, 0.2)
            }
        }

        @keyframes particle-drift {
            0% {
                transform: translate(0, 0) rotate(0deg);
                opacity: 0
            }

            10% {
                opacity: 0.6
            }

            90% {
                opacity: 0.6
            }

            100% {
                transform: translate(var(--dx), var(--dy)) rotate(var(--rot));
                opacity: 0
            }
        }

        @keyframes node-reveal {
            from {
                opacity: 0;
                transform: scale(0.7)
            }

            to {
                opacity: 1;
                transform: scale(1)
            }
        }

        .anim-slide-up {
            animation: slide-up .6s ease-out both
        }

        .anim-shake {
            animation: shake .5s ease-in-out
        }

        .anim-celebrate {
            animation: celebrate .4s ease-in-out
        }

        .anim-glow {
            animation: glow-pulse 2s ease-in-out infinite
        }

        .particle {
            position: absolute;
            font-family: 'Cinzel', serif;
            font-size: 11px;
            color: rgba(0, 230, 118, 0.08);
            pointer-events: none;
            animation: particle-drift var(--dur) linear infinite;
            white-space: nowrap
        }

        .sheet-container {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 4px;
            overflow: hidden;
            font-size: 13px
        }

        .sheet-ribbon {
            background: #2d2d2d;
            display: flex;
            align-items: center;
            padding: 4px 8px;
            gap: 4px;
            border-bottom: 1px solid #444;
            min-height: 32px
        }

        .sheet-tab {
            padding: 2px 10px;
            border-radius: 3px 3px 0 0;
            cursor: pointer;
            font-size: 11px;
            color: #ccc;
            background: transparent;
            transition: .2s
        }

        .sheet-tab.active {
            background: #1a1a1a;
            color: #fff
        }

        .sheet-formula-bar {
            display: flex;
            align-items: center;
            padding: 3px 8px;
            background: #2d2d2d;
            border-bottom: 1px solid #444;
            gap: 6px
        }

        .sheet-name-box {
            background: #fff;
            color: #333;
            padding: 2px 6px;
            border: 1px solid #555;
            border-radius: 2px;
            font-size: 11px;
            min-width: 60px;
            text-align: center
        }

        .sheet-fx {
            color: #888;
            font-size: 11px;
            font-style: italic
        }

        .sheet-formula-input {
            flex: 1;
            background: #fff;
            color: #333;
            padding: 2px 6px;
            border: 1px solid #555;
            border-radius: 2px;
            font-size: 12px;
            font-family: monospace
        }

        .sheet-grid {
            overflow: auto;
            max-height: 340px
        }

        .sheet-grid table {
            border-collapse: collapse
        }

        .sheet-grid th {
            background: #2d2d2d;
            color: #888;
            font-size: 11px;
            font-weight: 400;
            padding: 2px 0;
            min-width: 80px;
            border: 1px solid #444;
            position: sticky;
            top: 0;
            z-index: 2
        }

        .sheet-grid th.row-h {
            position: sticky;
            left: 0;
            z-index: 3;
            min-width: 35px;
            width: 35px
        }

        .sheet-grid th.corner {
            position: sticky;
            left: 0;
            top: 0;
            z-index: 4
        }

        .sheet-grid td {
            border: 1px solid #ddd;
            min-height: 22px;
            position: relative;
            cursor: default
        }

        .sheet-grid td.cell-ro {
            background: #fff;
            color: #333;
            padding: 1px 4px
        }

        .sheet-grid td.cell-edit {
            background: #fff;
            color: #333;
            cursor: text
        }

        .sheet-grid td.cell-edit:focus-within {
            outline: 2px solid #217346;
            outline-offset: -1px
        }

        .sheet-grid td.cell-click {
            background: #fff;
            color: #333;
            cursor: pointer;
            transition: .15s
        }

        .sheet-grid td.cell-click:hover {
            background: #e8f5e9
        }

        .sheet-grid td.cell-correct {
            background: #c8e6c9 !important;
            animation: celebrate .4s
        }

        .sheet-grid td.cell-wrong {
            background: #ffcdd2 !important;
            animation: shake .5s
        }

        .sheet-grid td.cell-pending {
            background: #fff9c4
        }

        .cell-input {
            width: 100%;
            border: none;
            background: transparent;
            padding: 1px 4px;
            font-size: 12px;
            font-family: monospace;
            outline: none;
            color: #333
        }

        .status-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            background: rgba(8, 13, 11, 0.92);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid #1a2e24;
            padding: 0 16px;
            height: 48px;
            display: flex;
            align-items: center;
            gap: 16px;
            transition: transform .3s
        }

        .xp-bar-track {
            height: 6px;
            background: #1a2e24;
            border-radius: 3px;
            flex: 1;
            max-width: 200px;
            overflow: hidden
        }

        .xp-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #00e676, #69f0ae);
            border-radius: 3px;
            transition: width .8s cubic-bezier(.22, 1, .36, 1)
        }

        .level-node {
            transition: all .3s;
            cursor: pointer
        }

        .level-node.locked {
            opacity: .4;
            cursor: not-allowed;
            filter: grayscale(1)
        }

        .level-node.completed .node-ring {
            border-color: #00e676
        }

        .level-node.current .node-ring {
            border-color: #ffab00;
            animation: pulse-glow 2s infinite
        }

        .node-ring {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: 2px solid #1a2e24;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0f1a15;
            transition: all .3s
        }

        .level-node:not(.locked):hover .node-ring {
            transform: scale(1.1);
            border-color: #00e676
        }

        .exercise-panel {
            background: #0f1a15;
            border: 1px solid #1a2e24;
            border-radius: 12px;
            padding: 24px;
            animation: slide-up .5s ease-out both
        }

        .btn-primary {
            background: linear-gradient(135deg, #00c853, #00e676);
            color: #080d0b;
            font-weight: 700;
            padding: 10px 24px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            transition: all .2s;
            font-size: 15px
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(0, 230, 118, 0.3)
        }

        .btn-primary:active {
            transform: translateY(0)
        }

        .btn-gold {
            background: linear-gradient(135deg, #ff8f00, #ffab00);
            color: #080d0b
        }

        .btn-gold:hover {
            box-shadow: 0 4px 20px rgba(255, 171, 0, 0.3)
        }

        .option-btn {
            background: #0f1a15;
            border: 1px solid #1a2e24;
            color: #e8f0ec;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: all .2s;
            text-align: left;
            font-size: 14px;
            width: 100%
        }

        .option-btn:hover {
            border-color: #00e676;
            background: #0a120e
        }

        .option-btn.correct {
            border-color: #00e676;
            background: rgba(0, 230, 118, 0.15);
            color: #00e676;
            pointer-events: none
        }

        .option-btn.wrong {
            border-color: #ff5252;
            background: rgba(255, 82, 82, 0.1);
            color: #ff5252;
            pointer-events: none
        }

        .feedback-toast {
            position: fixed;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 200;
            padding: 12px 28px;
            border-radius: 8px;
            font-weight: 600;
            animation: slide-up .3s ease-out;
            pointer-events: none;
            white-space: nowrap
        }

        .feedback-toast.success {
            background: rgba(0, 230, 118, 0.15);
            border: 1px solid #00e676;
            color: #00e676
        }

        .feedback-toast.error {
            background: rgba(255, 82, 82, 0.15);
            border: 1px solid #ff5252;
            color: #ff5252
        }

        .match-item {
            padding: 10px 16px;
            background: #0a120e;
            border: 1px solid #1a2e24;
            border-radius: 8px;
            cursor: pointer;
            transition: all .2s;
            font-size: 13px
        }

        .match-item:hover {
            border-color: #5a7d6c
        }

        .match-item.active {
            border-color: #ffab00;
            background: rgba(255, 171, 0, 0.08);
            color: #ffab00
        }

        .match-item.matched {
            border-color: #00e676;
            background: rgba(0, 230, 118, 0.08);
            color: #00e676;
            cursor: default;
            pointer-events: none
        }

        .match-item.wrong-match {
            border-color: #ff5252;
            animation: shake .4s
        }

        .skill-accordion {
            border: 1px solid #1a2e24;
            border-radius: 10px;
            overflow: hidden;
            transition: all .3s
        }

        .skill-accordion.open {
            border-color: #00e676
        }

        .skill-accordion-header {
            padding: 14px 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: background .2s
        }

        .skill-accordion-header:hover {
            background: rgba(0, 230, 118, 0.04)
        }

        .skill-accordion-body {
            max-height: 0;
            overflow: hidden;
            transition: max-height .4s ease, padding .3s
        }

        .skill-accordion.open .skill-accordion-body {
            max-height: 600px;
            padding: 0 16px 16px
        }

        .skill-accordion .chevron {
            transition: transform .3s;
            margin-left: auto;
            flex-shrink: 0
        }

        .skill-accordion.open .chevron {
            transform: rotate(180deg)
        }

        .mini-table {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 4px;
            overflow: hidden;
            font-size: 11px;
            margin: 8px 0
        }

        .mini-table table {
            border-collapse: collapse;
            width: 100%
        }

        .mini-table th {
            background: #2d2d2d;
            color: #888;
            font-size: 10px;
            padding: 3px 8px;
            border: 1px solid #444;
            text-align: left
        }

        .mini-table td {
            background: #fff;
            color: #333;
            padding: 2px 8px;
            border: 1px solid #ddd;
            font-family: monospace
        }

        .mini-table td.hl {
            background: #e8f5e9;
            font-weight: 600
        }

        .mini-table td.hl2 {
            background: #fff9c4;
            font-weight: 600
        }

        .formula-box {
            background: #1a1a1a;
            border: 1px solid #444;
            border-radius: 4px;
            padding: 6px 10px;
            font-family: monospace;
            font-size: 12px;
            color: #69f0ae;
            margin: 6px 0;
            display: inline-block
        }

        @media(max-width:640px) {
            .sheet-grid {
                max-height: 250px
            }

            .sheet-grid th,
            .sheet-grid td {
                min-width: 60px;
                font-size: 11px
            }

            .node-ring {
                width: 44px;
                height: 44px
            }
        }

        @media(prefers-reduced-motion:reduce) {

            *,
            *::before,
            *::after {
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: .01ms !important
            }
        }
    </style>
</head>

<body>

    <div class="status-bar" id="statusBar" style="transform:translateY(-100%)">
        <div class="font-display text-sm text-q-accent tracking-wider hidden sm:block">EXCEL QUEST</div>
        <div class="flex items-center gap-2 flex-1 max-w-[220px]">
            <i class="fa-solid fa-star text-q-gold text-xs"></i>
            <div class="xp-bar-track">
                <div class="xp-bar-fill" id="xpFill" style="width:0%"></div>
            </div>
            <span class="text-xs text-q-muted" id="xpLabel">0 XP</span>
        </div>
        <div class="flex items-center gap-4 text-xs text-q-muted">
            <span><i class="fa-solid fa-bolt text-q-accent mr-1"></i><span id="skillCount">0</span> hab.</span>
            <span><i class="fa-solid fa-bullseye text-q-gold mr-1"></i><span id="accuracyLabel">--</span>%</span>
            <span class="hidden sm:inline" id="currentQuest"></span>
        </div>
    </div>

    <div id="app" class="min-h-screen pt-12"></div>

    <script>
        var DEFAULT_STATE = { xp: 0, level: 0, completedLevels: [], skills: [], totalAttempts: 0, correctAttempts: 0, currentExercise: 0, levelAttempts: 0, levelCorrect: 0, preTestScore: null, postTestScore: null };
        var GS = JSON.parse(JSON.stringify(DEFAULT_STATE));
        function saveState() { try { localStorage.setItem('excel_quest_v3', JSON.stringify(GS)) } catch (e) { } }
        function loadState() { try { var s = JSON.parse(localStorage.getItem('excel_quest_v3')); if (s && typeof s === 'object') { GS.xp = s.xp || 0; GS.level = s.level || 0; GS.completedLevels = Array.isArray(s.completedLevels) ? s.completedLevels : []; GS.skills = Array.isArray(s.skills) ? s.skills : []; GS.totalAttempts = s.totalAttempts || 0; GS.correctAttempts = s.correctAttempts || 0; GS.currentExercise = s.currentExercise || 0; GS.levelAttempts = s.levelAttempts || 0; GS.levelCorrect = s.levelCorrect || 0; GS.preTestScore = s.preTestScore !== undefined ? s.preTestScore : null; GS.postTestScore = s.postTestScore !== undefined ? s.postTestScore : null; } } catch (e) { } }
        function resetState() { GS = JSON.parse(JSON.stringify(DEFAULT_STATE)); saveState(); go('landing') }
        function addXP(n) { GS.xp += n; saveState(); refreshBar() }
        function addSkill(name) { if (GS.skills.indexOf(name) === -1) { GS.skills.push(name); saveState(); refreshBar() } }
        function recordAttempt(ok) { GS.totalAttempts++; if (ok) GS.correctAttempts++; GS.levelAttempts++; if (ok) GS.levelCorrect++; saveState(); refreshBar() }
        function completeLevel(id) { if (GS.completedLevels.indexOf(id) === -1) { GS.completedLevels.push(id); if (GS.level <= id) GS.level = id + 1; } GS.currentExercise = 0; GS.levelAttempts = 0; GS.levelCorrect = 0; saveState() }
        function refreshBar() { var p = Math.min(100, (GS.xp / 1600) * 100); document.getElementById('xpFill').style.width = p + '%'; document.getElementById('xpLabel').textContent = GS.xp + ' XP'; document.getElementById('skillCount').textContent = GS.skills.length; var a = GS.totalAttempts > 0 ? Math.round((GS.correctAttempts / GS.totalAttempts) * 100) : 0; document.getElementById('accuracyLabel').textContent = GS.totalAttempts > 0 ? a : '--'; var q = document.getElementById('currentQuest'); q.textContent = (GS.level >= 1 && GS.level <= 8) ? LEVELS[GS.level - 1].shortTitle : '' }

        /* ============================================================
           DATOS DE NIVELES CON EXPLICACIONES EDUCATIVAS
           ============================================================ */
        var LEVELS = [
            {
                id: 1, title: 'El Despertar del Libro de Trabajo', shortTitle: 'Nivel 1: Interfaz', icon: 'fa-book-open',
                narrative: 'Te encuentras ante un imponente Libro de Trabajo, cuyo poder permanece oculto tras una interfaz misteriosa. Para dominarlo, primero debes comprender cada rincón de su estructura.',
                xpReward: 200,
                skills: ['Cinta de opciones', 'Cuadro de Nombres', 'Barra de Fórmulas', 'Pestañas de navegación', 'Celdas y rangos'],
                skillInfo: [
                    { name: 'Cinta de opciones', icon: 'fa-bars', desc: 'Es la barra principal situada en la parte superior de Excel, organizada en pestañas (Inicio, Insertar, Diseño de pagina, etc.). Cada pestaña contiene grupos de herramientas relacionados entre si. Por ejemplo, en la pestana Inicio encontraras los comandos de fuente, alineacion, formato de numero y estilos de celda.', example: 'Inicio > grupo Fuente > tamaño, negrita, color' },
                    { name: 'Cuadro de Nombres', icon: 'fa-tag', desc: 'Es un pequeno recuadro situado a la izquierda de la barra de formulas, que muestra la referencia de la celda activa (por ejemplo, A1). Puedes escribir directamente una referencia (como D15) y presionar Enter para saltar a esa celda. Tambien sirve para asignar nombres a celdas o rangos.', example: 'Escribe "D15" en el cuadro y pulsa Enter para ir a esa celda' },
                    { name: 'Barra de Formulas', icon: 'fa-code', desc: 'Se encuentra debajo de la cinta de opciones y muestra el contenido real de la celda activa. Si una celda muestra "150" pero contiene una formula como =A1+B1, la barra de formulas te revela la formula. Es donde editas formulas complejas sin que el contenido de la celda te distraiga. Empieza con el simbolo "fx".', example: 'Celda muestra "150" > Barra de formulas muestra "=A1+B1"' },
                    { name: 'Pestañas de navegacion', icon: 'fa-folder', desc: 'Estan en la parte inferior de la ventana: Hoja1, Hoja2, etc. Cada pestana es una hoja de calculo independiente dentro del mismo libro. Puedes agregar mas con el boton "+", renombrarlas con doble clic, y reordenarlas arrastrando.', example: 'Hoja1 | Hoja2 | Hoja3 | [+]' },
                    { name: 'Celdas y rangos', icon: 'fa-table-cells', desc: 'Una celda es la interseccion de una columna (letra) y una fila (numero): A1, B5, C10. Un rango es un grupo de celdas contiguas expresado como "inicio:fin", por ejemplo A1:D5 selecciona un bloque de 4 columnas por 5 filas.', example: 'A1 = columna A, fila 1\nA1:D5 = bloque desde A1 hasta D5' }
                ],
                exercises: [
                    { type: 'click-element', instruction: 'Haz clic en el Cuadro de Nombres en la interfaz simulada de Excel.', hint: 'Se encuentra arriba a la izquierda, entre la cinta y la hoja. Muestra "A1".', xp: 40, targets: ['name-box'] },
                    { type: 'click-element', instruction: 'Ahora haz clic en la Barra de Formulas.', hint: 'Esta a la derecha del Cuadro de Nombres, comienza con "fx".', xp: 40, targets: ['formula-bar'] },
                    { type: 'choice', instruction: 'En que pestana encuentras los comandos para cambiar tipo de letra, tamano y color de texto?', xp: 40, options: ['Insertar', 'Inicio', 'Diseno de pagina', 'Datos'], correct: 1, explanation: 'La pestana Inicio agrupa los comandos de formato mas utilizados.' },
                    { type: 'grid-click', instruction: 'Haz clic en la celda C4 en la hoja de calculo.', hint: 'La columna C es la tercera y la fila 4 es la cuarta.', xp: 40, target: 'C4', gridCols: 6, gridRows: 8 },
                    { type: 'choice', instruction: 'Cuantas hojas tiene un nuevo Libro de Trabajo de Excel por defecto?', xp: 40, options: ['1', '2', '3', '5'], correct: 0, explanation: 'Desde Excel 2013, un nuevo libro se crea con una sola hoja llamada "Hoja1".' }
                ]
            },
            {
                id: 2, title: 'La Alquimia de las Celdas', shortTitle: 'Nivel 2: Datos', icon: 'fa-flask',
                narrative: 'Las celdas son los recipientes alquimicos de Excel. En ellas puedes destilar texto, numeros y fechas. Los maestros conocen los atajos de teclado como hechizos de velocidad.',
                xpReward: 200,
                skills: ['Tipos de datos', 'Atajo Ctrl+G / Ctrl+S', 'Atajo F12', 'Autorelleno', 'Edicion de celdas'],
                skillInfo: [
                    { name: 'Tipos de datos', icon: 'fa-database', desc: 'Excel reconoce principalmente tres tipos de datos: Texto (letras y caracteres, alineado a la izquierda por defecto), Numeros (valores con los que se pueden calcular, alineados a la derecha) y Fechas (que internamente Excel almacena como numeros secuenciales desde el 1/1/1900). Cuando escribes un dato, Excel detecta automaticamente su tipo.', example: '"Ventas" = texto (izquierda)\n2500 = numero (derecha)\n15/03/2024 = fecha (derecha)' },
                    { name: 'Atajo Ctrl+G / Ctrl+S', icon: 'fa-floppy-disk', desc: 'Ctrl + S es el atajo universal para Guardar el archivo actual. En algunas versiones de Excel en espanol, Ctrl + G puede estar asignado a Guardar, pero es mas seguro usar Ctrl + S ya que funciona en todos los programas. Guardar frecuentemente evita perder trabajo.', example: 'Ctrl + S = Guardar\nCtrl + Shift + S o F12 = Guardar como' },

                    { name: 'Autorelleno', icon: 'fa-arrows-left-right', desc: 'Es el pequeno cuadrado negro que aparece en la esquina inferior derecha de una celda seleccionada. Al arrastrarlo, Excel detecta patrones y completa series automaticamente: dias de la semana, meses, numeros consecutivos, formulas copiadas, etc. Es una de las herramientas mas potentes para ser productivo.', example: 'Escribe "Lunes" > arrastra autorelleno 4 celdas a la derecha > aparecera: Mar, Mie, Jue, Vie' },

            {
                id: 3, title: 'El Código de los Operadores', shortTitle: 'Nivel 3: Formulas', icon: 'fa-calculator',
                narrative: 'Las formulas son el codigo secreto de Excel. Dominar los operadores aritmeticos y el orden de operaciones te permite realizar calculos poderosos. Todo hechizo en Excel comienza con =.',

                skills: ['Operadores aritmeticos', 'Orden de operaciones', 'Formulas basicas', 'Presupuesto dinamico', 'Referencias de celda'],
                skillInfo: [
                    { name: 'Operadores aritmeticos', icon: 'fa-plus-minus', desc: 'Excel usa los mismos operadores que las matematicas basicas: + (suma), - (resta), * (multiplicacion), / (division). Tambien existe ^ para potencias (ej: =2^3 da 8) y % para porcentaje. Estos operadores se combinan con referencias de celda para crear calculos dinamicos.', example: '=A1+B1 suma dos celdas\n=A1*B1 multiplica\n=A1/B1 divide\n=A1^2 eleva al cuadrado' },
                    { name: 'Orden de operaciones', icon: 'fa-sort-numeric-up', desc: 'Excel sigue la jerarquia matematica estandar: primero parentesis (), luego potencias ^, luego multiplicacion y division * / (de izquierda a derecha), y finalmente suma y resta + -. Si escribes =10+5*2 el resultado es 20, no 30, porque Excel multiplica primero. Usa parentesis para cambiar el orden: =(10+5)*2 da 30.', example: '=10+5*2 = 20 (multiplica primero)\n=(10+5)*2 = 30 (parentesis primero)\n=2+3*4/2 = 8 (3*4=12, 12/2=6, 2+6=8)' },
                    { name: 'Formulas basicas', icon: 'fa-equals', desc: 'Toda formula en Excel DEBE comenzar con el signo igual (=). Sin el =, Excel interpretara lo que escribas como texto simple. Despues del = puedes escribir numeros directos (=5+3), referencias de celda (=A1+B1), o combinar ambos (=A1*2+10).', example: '=5+3 muestra 8\n=A1+B1 muestra la suma de ambas celdas\n=A1*2+10 multiplica A1 por 2 y suma 10' },
                    { name: 'Presupuesto dinamico', icon: 'fa-wallet', desc: 'Un presupuesto dinamico es aquel que se recalcula automaticamente cuando cambias algun valor de entrada. Si A1 es tu ingreso y A2:A4 son tus gastos, la formula =A1-SUMA(A2:A4) dara el saldo restante. Si cambias un gasto, el saldo se actualiza solo. Esta es la verdadera potencia de Excel.', example: 'Ingreso: 5000\nRenta: -1200\nComida: -800\nTransporte: -300\nSaldo: =5000-1200-800-300 = 2700' },
                    { name: 'Referencias de celda en formulas', icon: 'fa-link', desc: 'En lugar de escribir numeros fijos (constantes) en tus formulas, usa referencias de celda (A1, B5, etc.). Esto hace que la formula sea dinamica: si el valor de A1 cambia, el resultado de la formula cambia automaticamente. Las constantes te obligan a editar la formula manualmente cada vez.', example: 'Mal: =100+200+300 (numeros fijos)\nBien: =A1+A2+A3 (se actualiza solo)' }

                    { type: 'formula-input', instruction: 'A1=10, B1=20, C1=5. Escribe en D1 una formula que sume A1 y B1, luego multiplique por C1. Usa parentesis.', xp: 40, context: { A1: 10, B1: 20, C1: 5 }, answerCell: 'D1', acceptedAnswers: ['=(a1+b1)*c1', '=(b1+a1)*c1'], displayResult: 150 },
                    { type: 'choice', instruction: 'Cual es el resultado de =10+5*2 en Excel?', xp: 30, options: ['30', '20', '25', '40'], correct: 1, explanation: 'Primero multiplicacion (5*2=10), luego suma (10+10=20).' },
                    { type: 'formula-input', instruction: 'Presupuesto: A1=5000, A2=1200, A3=800, A4=300. Escribe en A5 el saldo restante.', xp: 50, context: { A1: 5000, A2: 1200, A3: 800, A4: 300, B1: 'Ingreso', B2: 'Renta', B3: 'Comida', B4: 'Transporte', B5: 'Saldo' }, answerCell: 'A5', acceptedAnswers: ['=a1-a2-a3-a4', '=a1-(a2+a3+a4)'], displayResult: 2700 },

            {

                narrative: 'Existe un poder mayor en Excel: la capacidad de fijar celdas usando el simbolo dolar ($). Comprender las diferencias entre referencias relativas, absolutas y mixtas es lo que separa al aprendiz del verdadero arquitecto.',

                skills: ['Referencias relativas', 'Referencias absolutas ($A$1)', 'Referencias mixtas ($A1, A$1)', 'Tecla F4', 'Tabla de multiplicar con $'],
                skillInfo: [
                    { name: 'Referencias relativas', icon: 'fa-arrows-alt', desc: 'Es el comportamiento por defecto de Excel. Cuando escribes =A1 en B1 y copias la formula a B2, Excel cambia automaticamente la referencia a =A2. Excel ajusta las referencias en funcion de cuantas filas y columnas te has movido al copiar. Son "relativas" a la posicion de la formula.', example: 'B1: =A1\nCopiar B1 a B2\nB2: =A2 (se ajusta automaticamente)' },
                    { name: 'Referencias absolutas ($A$1)', icon: 'fa-lock', desc: 'Al poner un signo $ antes de la columna y antes de la fila ($A$1), la referencia queda FIJA. Si copias =A1 a otra celda, cambia. Pero si copias =$A$1, seguira apuntando a A1 sin importar donde la pegues. Se usa cuando necesitas que una formula siempre haga referencia a la misma celda (como una tasa de cambio fija).', example: 'B1: =$A$1\nCopiar B1 a B2\nB2: =$A$1 (no cambia, sigue apuntando a A1)' },
                    { name: 'Referencias mixtas ($A1, A$1)', icon: 'fa-arrows-left-right-to-line', desc: 'Puedes fijar solo la columna o solo la fila. $A1 fija la columna A pero la fila cambia al copiar verticalmente. A$1 fija la fila 1 pero la columna cambia al copiar horizontalmente. Son utiles para tablas de busqueda y tablas de multiplicar.', example: '$A1: columna fija, fila libre\nA$1: fila fija, columna libre\n$A$1: ambas fijas\nA1: ambas libres' },
                    { name: 'Tecla F4', icon: 'fa-keyboard', desc: 'Cuando estas editando una formula, presionar F2 para editar y luego F4 sobre una referencia alterna ciclicamente entre los cuatro tipos: A1 > $A$1 > A$1 > $A1 > A1. Es el metodo mas rapido para cambiar el tipo de referencia sin tener que escribir los $ manualmente.', example: 'Escribe =A1 en la formula\nPresiona F4 > =$A$1\nPresiona F4 > =A$1\nPresiona F4 > =$A1\nPresiona F4 > =A1 (vuelve al inicio)' },
                    { name: 'Tabla de multiplicar con $', icon: 'fa-table', desc: 'El ejemplo clasico de referencias mixtas: si los numeros 1-5 estan en la fila 1 (B1:F1) y en la columna A (A2:A6), la formula =$A2*B$1 en B2 se copia correctamente a todo el rango. $A2 fija la columna del multiplicando, B$1 fija la fila del multiplicador.', example: 'B2: =$A2*B$1 (1x1=1)\nCopiar a C2: =$A2*C$1 (1x2=2)\nCopiar a B3: =$A3*B$1 (2x1=2)\nCopiar a C3: =$A3*C$1 (2x2=4)' }
                ],

                    { name: 'Funcion CONTAR', icon: 'fa-list-ol', desc: 'Cuenta cuantas celdas del rango contienen NUMEROS. No cuenta texto, celdas vacias ni errores. Sintaxis: =CONTAR(rango). Si necesitas contar todo (incluyendo texto), usa =CONTARA(). Si necesitas contar con una condicion, usa =CONTAR.SI().', example: 'A1:A5 = 10, "Hola", 30, "", 50\n=CONTAR(A1:A5) = 3 (solo cuenta 10, 30, 50)\n=CONTARA(A1:A5) = 4 (cuenta todo excepto vacias)' },
                    { name: 'Funcion MAX', icon: 'fa-arrow-up', desc: 'Devuelve el valor NUMERICO mas alto de un rango. Sintaxis: =MAX(rango). Su complemento es =MIN(rango) que devuelve el valor mas bajo. Ambas ignoran celdas vacias y texto.', example: 'A1:A5 = 10, 25, 8, 42, 15\n=MAX(A1:A5) = 42\n=MIN(A1:A5) = 8' },

        /* ============================================================
           NAVEGACION
           ============================================================ */
        var currentView = 'landing', currentLevelIdx = -1, currentExIdx = 0, toastTimer = null;
        function go(view, data) {
            currentView = view;
            var app = document.getElementById('app'), sb = document.getElementById('statusBar');
            try {
                if (view === 'landing') { sb.style.transform = 'translateY(-100%)'; app.innerHTML = buildLanding(); startParticles(); }
                else if (view === 'map') { sb.style.transform = 'translateY(0)'; refreshBar(); app.innerHTML = buildMap(); }
                else if (view === 'intro') { currentLevelIdx = data.idx; currentExIdx = 0; app.innerHTML = buildIntro(LEVELS[currentLevelIdx]); }
                else if (view === 'exercise') { currentLevelIdx = data.idx; currentExIdx = data.exIdx || 0; app.innerHTML = buildExercise(LEVELS[currentLevelIdx], currentExIdx); setupExercise(LEVELS[currentLevelIdx], currentExIdx); }
                else if (view === 'complete') { currentLevelIdx = data.idx; completeLevel(LEVELS[currentLevelIdx].id); app.innerHTML = buildComplete(LEVELS[currentLevelIdx]); }
                else if (view === 'gamecomplete') { sb.style.transform = 'translateY(-100%)'; app.innerHTML = buildGameComplete(); startParticles(); }
                else if (view === 'pretest') { sb.style.transform = 'translateY(-100%)'; app.innerHTML = buildPreTest(); }
                else if (view === 'posttest') { sb.style.transform = 'translateY(-100%)'; app.innerHTML = buildPostTest(); }
            } catch (err) { app.innerHTML = '<div style="padding:40px;text-align:center;color:#ff5252"><p>Error al renderizar.</p><button onclick="resetState()" style="color:#00e676;text-decoration:underline;margin-top:12px;display:inline-block">Reiniciar</button></div>'; console.error(err); }
            window.scrollTo(0, 0);
        }

        function toast(msg, type) { var o = document.querySelector('.feedback-toast'); if (o) o.remove(); var t = document.createElement('div'); t.className = 'feedback-toast ' + type; t.innerHTML = '<i class="fa-solid ' + (type === 'success' ? 'fa-check-circle' : 'fa-times-circle') + '" style="margin-right:8px"></i>' + msg; document.body.appendChild(t); clearTimeout(toastTimer); toastTimer = setTimeout(function () { if (t.parentNode) t.remove() }, 2500); }
        
        function goStart() {
            if (GS.preTestScore === null) go('pretest');
            else go('map');
        }

        var PLABELS = ['A1', 'B2', '=SUMA', '$C$5', 'SI()', 'F12', 'Ctrl+G', 'MAX', 'PROMEDIO', 'CONTAR', 'MIN', 'Alt+F1'];
        var pInterval = null;
        function startParticles() { clearInterval(pInterval); var box = document.getElementById('particles'); if (!box) return; pInterval = setInterval(function () { if (box.children.length > 14) return; var p = document.createElement('div'); p.className = 'particle'; p.textContent = PLABELS[Math.floor(Math.random() * PLABELS.length)]; p.style.left = Math.random() * 100 + '%'; p.style.top = (60 + Math.random() * 40) + '%'; p.style.setProperty('--dx', (Math.random() * 100 - 50) + 'px'); p.style.setProperty('--dy', -(200 + Math.random() * 300) + 'px'); p.style.setProperty('--rot', Math.random() * 360 + 'deg'); p.style.setProperty('--dur', (8 + Math.random() * 12) + 's'); box.appendChild(p); setTimeout(function () { if (p.parentNode) p.remove() }, 20000) }, 900); }

        /* ============================================================
           BUILD: MAPA
           ============================================================ */
        function buildMap() {
            var progress = GS.completedLevels.length;
            var nextId = 1;

            var h = '<div class="max-w-lg mx-auto px-4 py-8">';

            /* Seccion educativa: Acordeon de habilidades */

            for (var i = 0; i < lv.skillInfo.length; i++) {
                var si = lv.skillInfo[i];

            h += '<h2 class="font-display text-3xl font-bold mb-2">Reino Conquistado</h2><p class="text-q-muted mb-8">' + lv.title + '</p>';
            h += '<div class="grid grid-cols-3 gap-4 mb-8">';
            h += '<div class="bg-q-card border border-q-border rounded-xl p-4"><div class="text-2xl font-bold text-q-gold">' + lv.xpReward + '</div><div class="text-xs text-q-muted mt-1">XP</div></div>';
            h += '<div class="bg-q-card border border-q-border rounded-xl p-4"><div class="text-2xl font-bold text-q-accent">' + lv.skills.length + '</div><div class="text-xs text-q-muted mt-1">Habilidades</div></div>';
            h += '<div class="bg-q-card border border-q-border rounded-xl p-4"><div class="text-2xl font-bold text-q-text">' + acc + '%</div><div class="text-xs text-q-muted mt-1">Precision</div></div></div>';
            h += '<div class="mb-8"><h3 class="text-xs text-q-muted tracking-wider uppercase mb-3">Habilidades Desbloqueadas</h3><div class="flex flex-wrap justify-center gap-2">';
            for (var i = 0; i < lv.skills.length; i++)h += '<span class="text-xs px-3 py-1.5 rounded-lg border border-q-accent bg-q-accent/10 text-q-accent"><i class="fa-solid fa-check mr-1"></i>' + lv.skills[i] + '</span>';
            h += '</div></div><div class="flex flex-col gap-3">';
            h += '<button onclick="go(\'map\')" class="btn-primary btn-gold py-3 font-display tracking-wider"><i class="fa-solid fa-map mr-2"></i>Ver Mapa</button>';
            if (currentLevelIdx < LEVELS.length - 1) h += '<button onclick="go(\'intro\',{idx:' + (currentLevelIdx + 1) + '})" class="btn-primary py-3"><i class="fa-solid fa-arrow-right mr-2"></i>Siguiente Reino</button>';
            h += '</div></div>'; return h;
        }

        function buildGameComplete() {
            var acc = GS.totalAttempts > 0 ? Math.round((GS.correctAttempts / GS.totalAttempts) * 100) : 0;
            var h = '<div class="min-h-screen flex items-center justify-center relative overflow-hidden">';
            h += '<div class="absolute inset-0" style="background:radial-gradient(ellipse at center,rgba(255,171,0,0.08),transparent 70%)"></div>';
            h += '<div id="particles" class="absolute inset-0 pointer-events-none"></div>';
            h += '<div class="relative z-10 text-center px-4 anim-slide-up max-w-lg">';
            h += '<div class="w-24 h-24 rounded-full bg-q-gold/10 border-2 border-q-gold flex items-center justify-center mx-auto mb-6" style="animation:pulse-glow 2s infinite"><i class="fa-solid fa-crown text-q-gold text-4xl"></i></div>';
            h += '<h1 class="font-display text-4xl sm:text-5xl font-black mb-2" style="color:#ffab00">Maestro Excel</h1><p class="text-q-muted text-lg mb-8">Has conquistado todos los reinos.</p>';
            h += '<div class="grid grid-cols-2 gap-4 mb-8">';
            h += '<div class="bg-q-card border border-q-border rounded-xl p-5"><div class="text-3xl font-bold text-q-gold">' + GS.xp + '</div><div class="text-xs text-q-muted mt-1">XP Total</div></div>';
            h += '<div class="bg-q-card border border-q-border rounded-xl p-5"><div class="text-3xl font-bold text-q-accent">' + GS.skills.length + '</div><div class="text-xs text-q-muted mt-1">Habilidades</div></div>';
            h += '<div class="bg-q-card border border-q-border rounded-xl p-5"><div class="text-3xl font-bold text-q-text">' + acc + '%</div><div class="text-xs text-q-muted mt-1">Precision</div></div>';
            h += '<div class="bg-q-card border border-q-border rounded-xl p-5"><div class="text-3xl font-bold text-q-text">8/8</div><div class="text-xs text-q-muted mt-1">Reinos</div></div></div>';
            h += '<div class="mb-8"><h3 class="text-xs text-q-muted tracking-wider uppercase mb-3">Todas tus Habilidades</h3><div class="flex flex-wrap justify-center gap-1.5">';
            for (var i = 0; i < GS.skills.length; i++)h += '<span class="text-[11px] px-2 py-1 rounded bg-q-accent/10 text-q-accent border border-q-accent/20">' + GS.skills[i] + '</span>';
            h += '</div></div>';
            if (GS.postTestScore === null) {
                h += '<button onclick="go(\'posttest\')" class="btn-primary btn-gold px-8 py-3 font-display tracking-wider"><i class="fa-solid fa-clipboard-check mr-2"></i>Realizar Post-Test</button>';
            } else {
                h += '<div class="bg-q-card border border-q-border rounded-xl p-5 mb-8 w-full"><div class="text-xs text-q-muted mb-2">Evaluación Final</div><div class="flex justify-around"><div class="text-center"><div class="text-xl text-q-danger">' + GS.preTestScore + '%</div><div class="text-xs">Pre-Test</div></div><div class="text-center"><div class="text-xl text-q-accent">' + GS.postTestScore + '%</div><div class="text-xs">Post-Test</div></div></div></div>';
                h += '<button onclick="go(\'map\')" class="btn-primary btn-gold px-8 py-3 font-display tracking-wider"><i class="fa-solid fa-rotate mr-2"></i>Revisar Mapa</button>';
            }
            h += '<div class="mt-4"><button onclick="resetState()" class="text-xs text-q-muted hover:text-q-danger transition underline underline-offset-2">Reiniciar aventura</button></div></div></div>'; return h;
        }

        /* ============================================================
           TESTS
           ============================================================ */
        var testQuestions = [
            { q: '¿Qué atajo se usa para guardar en la mayoría de versiones?', opts: ['Ctrl+S', 'Ctrl+P', 'Alt+G', 'Shift+S'], correct: 0 },
            { q: '¿Qué operador se usa para fijar una celda (referencia absoluta)?', opts: ['#', '&', '$', '%'], correct: 2 },
            { q: '¿Cuál es la función correcta para sumar de A1 a A5?', opts: ['=A1:A5', '=SUMA(A1,A5)', '=SUMA(A1:A5)', 'SUMA A1-A5'], correct: 2 },
            { q: '¿Para qué sirve el formato condicional?', opts: ['Dar formato al texto', 'Cambiar colores según el valor', 'Borrar celdas vacías', 'Crear gráficos'], correct: 1 },
            { q: '¿Qué tipo de gráfico muestra mejor una tendencia en el tiempo?', opts: ['Circular', 'Columnas', 'Líneas', 'Dispersión'], correct: 2 }
        ];

        function buildPreTest() {
            return buildTestUI('Pre-Test: Evaluación Inicial', 'Descubre tu nivel antes de comenzar', 'pretest');
        }

        function buildPostTest() {
            return buildTestUI('Post-Test: Evaluación Final', 'Demuestra lo que has aprendido', 'posttest');
        }

        function buildTestUI(title, subtitle, type) {
            var h = '<div class="max-w-2xl mx-auto px-4 py-12 anim-slide-up" id="testContainer">';
            h += '<div class="text-center mb-8"><h2 class="font-display text-3xl font-bold mb-2 text-q-accent">' + title + '</h2>';
            h += '<p class="text-q-muted">' + subtitle + '</p></div>';
            h += '<div id="questionsArea" class="space-y-6">';
            for(var i=0; i<testQuestions.length; i++) {
                h += '<div class="exercise-panel p-6"><p class="font-semibold mb-4">' + (i+1) + '. ' + testQuestions[i].q + '</p><div class="flex flex-col gap-2">';
                for(var j=0; j<testQuestions[i].opts.length; j++) {
                    h += '<label class="flex items-center gap-3 p-3 border border-q-border rounded-lg cursor-pointer hover:bg-q-border/30 transition"><input type="radio" name="q'+i+'" value="'+j+'" class="accent-q-accent"><span>' + testQuestions[i].opts[j] + '</span></label>';
                }
                h += '</div></div>';
            }
            h += '</div>';
            h += '<div class="mt-8 text-center"><button onclick="submitTest(\'' + type + '\')" class="btn-primary py-3 px-8 text-lg"><i class="fa-solid fa-check mr-2"></i>Enviar Respuestas</button></div>';
            h += '</div>';
            return h;
        }

        function submitTest(type) {
            var score = 0;
            var answeredAll = true;
            for(var i=0; i<testQuestions.length; i++) {
                var selected = document.querySelector('input[name="q'+i+'"]:checked');
                if(!selected) { answeredAll = false; break; }
                if(parseInt(selected.value) === testQuestions[i].correct) score += 20;
            }
            if(!answeredAll) { toast('Por favor, responde todas las preguntas.', 'error'); return; }
            if(type === 'pretest') {
                GS.preTestScore = score;
                saveState();
                var c = document.getElementById('testContainer');
                c.innerHTML = '<div class="text-center py-12"><i class="fa-solid fa-clipboard-check text-4xl text-q-accent mb-4"></i><h2 class="text-2xl font-bold mb-2">Pre-Test Completado</h2><p class="text-q-muted mb-8">Puntaje inicial: ' + score + '%</p><button onclick="go(\'map\')" class="btn-primary py-3 px-8">Comenzar Aventura</button></div>';
            } else {
                GS.postTestScore = score;
                saveState();
                go('gamecomplete');
            }
        }

        /* ============================================================
           INICIO
           ============================================================ */
        loadState();
        go(GS.level >= 1 && GS.level <= 8 ? 'map' : 'landing');
    </script>
</body>

</html>
